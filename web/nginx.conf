# Rate limiting and connection limiting zones for public hosting protection
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=candle_limit:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Global connection limit per client IP
    limit_conn addr_conn 30;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket market-data stream with bounded idle and send timeouts
    location /ws {
        proxy_pass http://server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
    }

    # Bounded historical candle queries
    location /candles {
        limit_req zone=candle_limit burst=10 nodelay;
        proxy_pass http://server:8080/candles;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Health and read endpoints
    location ~ ^/(health|feed-rate) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
