[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-writer engine thread, WebSocket market data, batched TimescaleDB persistence"
default-run = "server"

[dependencies]
engine = { path = "../engine" }
feed = { path = "../feed" }
tokio = { workspace = true }
axum = { workspace = true }
crossbeam-channel = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
hdrhistogram = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
feed = { path = "../feed" }
serde_json = { workspace = true }
sqlx = { workspace = true }

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "e2e_latency"
path = "src/bin/e2e_latency.rs"

[[bin]]
name = "ws_probe"
path = "src/bin/ws_probe.rs"
