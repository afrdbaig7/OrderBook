name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  persistence:
    name: Persistence (TimescaleDB)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: orderbook
          POSTGRES_PASSWORD: orderbook
          POSTGRES_DB: orderbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbook -d orderbook"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply schema
        run: PGPASSWORD=orderbook psql -h localhost -U orderbook -d orderbook -f db/schema.sql
      - name: Phase E persistence gate
        env:
          TEST_DATABASE_URL: postgres://orderbook:orderbook@localhost:5432/orderbook
        run: cargo test -p server --test persistence -- --nocapture

  web:
    name: Web (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build