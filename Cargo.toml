[workspace]
resolver = "2"
members = ["crates/engine", "crates/bench", "crates/feed", "crates/server", "crates/replay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
rand = "0.9"
rand_chacha = "0.9"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
crossbeam-channel = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
