# Full-stack order book deployment:
#
#   docker compose up --build
#
# Access the web dashboard at: http://localhost:5173
#
# To stop without losing persistent database data:
#   docker compose down
#
# To stop and permanently remove database data:
#   docker compose down -v
#
# For native development with host database access (port 5434):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d timescaledb

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: orderbook-db
    environment:
      POSTGRES_USER: orderbook
      POSTGRES_PASSWORD: orderbook
      POSTGRES_DB: orderbook
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderbook -d orderbook"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: orderbook-server
    environment:
      - DATABASE_URL=postgres://orderbook:orderbook@timescaledb:5432/orderbook
      - RUST_LOG=info
      - ALLOW_PUBLIC_FEED_RATE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: orderbook-web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: